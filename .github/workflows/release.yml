name: Multi-OS Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'rel/**'
      - 'release/**'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark this release as a pre-release?'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Save as a draft release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. ANDROID BUILD (APK & AAB)
  # ==========================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Prepare Android Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/open-stage-set-android.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/open-stage-set-android.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          retention-days: 7

  # ==========================================
  # 2. LINUX BUILD (deb, rpm, arch, appimage, flatpak, tar.gz)
  # ==========================================
  build-linux:
    name: Build Linux Packages (deb, rpm, arch, appimage, flatpak)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm zstd libarchive-tools ruby ruby-dev rubygems flatpak flatpak-builder
          sudo gem install --no-document fpm

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Artifacts (deb, rpm, arch, appimage, tarball)
        run: |
          ./packaging/linux/package-linux.sh 1.0.0

      - name: Build Flatpak Bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 || true
          if flatpak info --user org.freedesktop.Platform//23.08 >/dev/null 2>&1; then
            mkdir -p packaging/flatpak/bundle
            cp -r build/linux/x64/release/bundle/* packaging/flatpak/bundle/
            cp web/icons/Icon-512.png packaging/flatpak/open-stage-set.png
            flatpak-builder --user --repo=flatpak-repo --force-clean build-flatpak packaging/flatpak/org.openstageset.OpenStageSet.yml || true
            if [ -d "flatpak-repo" ]; then
              flatpak build-bundle --user flatpak-repo dist/open-stage-set.flatpak org.openstageset.OpenStageSet || true
            fi
          else
            echo "Flatpak runtime not available, skipping flatpak bundle"
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*
          retention-days: 7

  # ==========================================
  # 3. WINDOWS BUILD (setup installer & portable zip)
  # ==========================================
  build-windows:
    name: Build Windows Desktop (Setup & Portable)
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\open_stage_set.iss

      - name: Package Windows Portable Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\open-stage-set-windows-x64-portable.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          retention-days: 7

  # ==========================================
  # 4. WEB BUILD (tar.gz)
  # ==========================================
  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --base-href "/"

      - name: Package Web Build
        run: |
          mkdir -p dist
          tar -czvf dist/open-stage-set-web.tar.gz -C build/web .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist/open-stage-set-web.tar.gz
          retention-days: 7

  # ==========================================
  # 5. PUBLISH GITHUB RELEASE
  # ==========================================
  publish-release:
    name: Publish Multi-OS GitHub Release
    needs: [build-android, build-linux, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" == refs/heads/rel/* ]]; then
            TAG="${GITHUB_REF_NAME#rel/}"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            TAG="${GITHUB_REF_NAME#release/}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display Release Files
        run: ls -lh release-artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ### Open Stage Set - Multi-Platform Release 🚀

            Distraction-free, high-contrast live performance & setlist companion for musicians.

            #### 📦 Download Packages by Platform:

            ##### 🤖 Android
            - **Standalone APK**: `open-stage-set-android.apk` (Direct install on Android phones & tablets)
            - **Google Play Store**: `open-stage-set-android.aab` (Google Play App Bundle)

            ##### 🪟 Windows Desktop
            - **Setup Wizard Installer**: `open-stage-set-windows-x64-setup.exe` (Recommended: installs desktop shortcut, start menu entry, uninstaller)
            - **Portable Zip**: `open-stage-set-windows-x64-portable.zip` (Portable standalone executable folder)

            ##### 🐧 Linux Desktop
            - **Debian / Ubuntu**: `open-stage-set-linux-amd64.deb` (`sudo dpkg -i ...`)
            - **Fedora / RHEL / openSUSE**: `open-stage-set-linux-x86_64.rpm` (`sudo rpm -i ...`)
            - **Arch Linux / Manjaro**: `open-stage-set-linux-x86_64.pkg.tar.zst` (`sudo pacman -U ...`)
            - **Universal AppImage**: `open-stage-set-x86_64.AppImage` (Executable on any Linux distribution)
            - **Flatpak Bundle**: `open-stage-set.flatpak` (`flatpak install ...`)
            - **Portable Tarball**: `open-stage-set-linux-x64.tar.gz` (Extracted directory bundle)

            ##### 🌐 Web Application
            - **Static Web Production**: `open-stage-set-web.tar.gz` (Deploy to GitHub Pages, Netlify, Cloudflare, Nginx)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
